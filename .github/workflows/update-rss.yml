name: Update RSS

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: update-rss
  cancel-in-progress: true

jobs:
  update-rss:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate RSS
        run: |
          mkdir -p docs
          python3 filter_note_rss.py \
            https://note.com/metakit/rss \
            docs/metakit_note_short.rss

      - name: Validate RSS XML
        run: python3 -m xml.etree.ElementTree docs/metakit_note_short.rss

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
