name: Update RSS

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rss
  cancel-in-progress: true

jobs:
  update-rss:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate RSS
        run: |
          mkdir -p docs
          python3 filter_note_rss.py \
            https://note.com/metakit/rss \
            docs/metakit_note_short.rss

      - name: Validate RSS XML
        run: python3 -m xml.etree.ElementTree docs/metakit_note_short.rss

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/metakit_note_short.rss

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update generated RSS"

          git pull --rebase origin master

          git push origin master
